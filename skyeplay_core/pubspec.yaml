name: skyeplay_core
description: Headless Discovery & Playback Core (Pure Dart)
version: 0.0.1
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  # Networking
  http: ^1.2.0
  dio: ^5.4.0
  youtube_explode_dart: ^3.0.0
  
  # Scripting
  hetu_script: ^0.4.2+1
  hetu_std:
    git:
      url: https://github.com/hetu-community/hetu_std.git
      ref: main
  hetu_otp_util:
    git:
      url: https://github.com/hetu-community/hetu_otp_util.git
      ref: main
#   hetu_spotube_plugin:
#     git:
#       url: https://github.com/KRTirtho/hetu_spotube_plugin.git
#       ref: main
  
  # Utils
  path: ^1.9.0
  archive: ^3.6.1
  collection: ^1.18.0
  logger: ^2.0.0
  uuid: ^4.3.3
  shared_preferences: ^2.2.2 # Check if this supports pure dart (Linux/Windows implementations often do)
  # Actually shared_preferences usually requires flutter connection or ffi. 
  # We should use a pure dart alternative like hive or just raw json/file for settings in headless.
  # switching to just local file for now.
  
  # Database
  drift: ^2.14.0
  sqlite3: ^2.1.0
  
  # Annotations
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
  build_runner: ^2.4.8
  drift_dev: ^2.14.0
  json_serializable: ^6.7.1
  freezed: ^2.4.6
